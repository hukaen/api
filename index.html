<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-[#f4f2f1] flex justify-center mt-8 gap-[20px]">
    <div class="flex flex-col gap-5">
      <div class="flex bg-indigo-100 p-2 rounded-full">
        <input
          id="searchInput"
          type="text"
          placeholder="Хайх..."
          class="w-full pl-2 focus:outline-none"
        />
        <button
          class="rounded-full bg-indigo-300 py-1 px-4"
          onclick="searchByName()"
        >
          Хайх
        </button>
      </div>
      <div class="flex gap-4">
        <button
          class="rounded-full bg-indigo-300 py-1 px-4"
          onclick="searchByType(`foods`)"
        >
          Бүх хоол
        </button>
        <button
          class="rounded-full bg-indigo-300 py-1 px-4"
          onclick="searchByType(`foods?type=shul`)"
        >
          Шөлтэй хоол
        </button>
        <button
          class="rounded-full bg-indigo-300 py-1 px-4"
          onclick="searchByType(`foods?type=huurai`)"
        >
          Хуурай хоол
        </button>
      </div>
      <div class="flex flex-col gap-2">
        <h1 id="result" class="text-[12px]">Хайлтын үр дүн</h1>
        <div
          id="menu"
          class="flex w-[800px] grid grid-cols-5 gap-4 mt-auto justify-between"
        ></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
